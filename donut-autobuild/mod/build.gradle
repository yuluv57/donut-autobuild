// Donut Auto Build — Fabric 1.21.4. Dựa trên build.gradle của bản 3.0.17 (đã build được trên máy người dùng).
buildscript {
    repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
    dependencies { classpath 'net.fabricmc:fabric-loom:1.17.7' }
}
plugins { id 'java' }
apply plugin: 'fabric-loom'
version = project.mod_version
group = 'com.donutautobuild'
base { archivesName = 'donut-autobuild-fabric-1.21.4' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // các module Fabric API được đóng kèm trong jar (META-INF/jars) — cùng danh sách với jar 3.0.121
    ['fabric-api-base', 'fabric-resource-loader-v0', 'fabric-command-api-v2', 'fabric-key-binding-api-v1',
     'fabric-lifecycle-events-v1', 'fabric-networking-api-v1'].each {
        def module = fabricApi.module(it, project.fabric_version)
        modImplementation(module)
        include(module)
    }
    // ChatHook dùng ClientReceiveMessageEvents; người chơi đã có Fabric API đầy đủ nên không đóng kèm
    modCompileOnly fabricApi.module('fabric-message-api-v1', project.fabric_version)
    // 3 jar này KHÔNG có trong repo — chép vào mod/libs/ (xem libs/README.md)
    modImplementation files('libs/litematica-fabric-1.21.4-0.21.7.jar')
    modImplementation fileTree(dir: 'libs', include: 'malilib-*.jar')
    modImplementation files('libs/fabric-rendering-v1-10.1.2+b874120c04.jar')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
jar {
    from('libs/fabric-rendering-v1-10.1.2+b874120c04.jar') { into 'META-INF/jars' }
}
